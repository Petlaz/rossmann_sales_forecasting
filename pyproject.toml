[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "rossmann_sales_forecasting"
version = "0.0.1"
description = "Rossmann sales store forecasting"
authors = [
  { name = "Peter Ugonna Obi" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["rossmann_sales_forecasting"]
include = ["pyproject.toml", "rossmann_sales_forecasting/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["rossmann_sales_forecasting"]
force-sort-within-sections = true

